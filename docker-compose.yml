version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Streamlit App
  # ─────────────────────────────────────────────
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abtest_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./outputs:/app/outputs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      - mlflow-server
    networks:
      - abtest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────
  # MLflow Tracking Server
  # ─────────────────────────────────────────────
  mlflow-server:
    image: python:3.11-slim
    container_name: abtest_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./models:/models
    command: >
      bash -c "pip install --quiet mlflow &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri /mlruns
               --default-artifact-root /models"
    networks:
      - abtest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ─────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────
networks:
  abtest-network:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  mlruns_data:
  models_data: